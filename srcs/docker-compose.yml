
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file: .env
    networks:
    - inception
    volumes:
    - db_data:/var/bin/mysql
    restart: on-failure
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - wp_data:/var/www/html
    restart: on-failure

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    restart: on-failure

volumes:
  db_data:
    driver: local
    driver_opts:
     type: none
    o: bind
    device: /home/jait-ame/data/mariadb
  wp_data:
    driver: local
    driver_opts:
    type: none
    o: bind
    device: /home/jait-ame/data/wordpress

networks:
  inception:
    driver: bridge


